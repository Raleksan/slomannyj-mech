[project]
name = "bookgraph"
version = "0.1.0"
description = "Storyline graph and Obsidian notes from a book, with a local LLM"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Stages that call the model. parse and chunk need only the standard library.
llm = ["httpx>=0.27", "pydantic>=2.7", "pymorphy3>=2.0"]

[project.scripts]
bookgraph = "bookgraph.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bookgraph"]
